name: Deploy preprod

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /home/poupi/projects/matchcredit/web
            git fetch origin
            git reset --hard origin/dev
            docker exec matchcredit_wp chown -R www-data:www-data \
              /var/www/html/wp-content/themes/matchcredit-theme \
              /var/www/html/wp-content/plugins/matchcredit-tools
